name: Deploy

# Deploys to Cloudflare Workers after CI passes on main (and on demand).
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  — token with "Edit Workers" + "D1 Edit" permissions
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare account id

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (Next.js static export for Workers)
        run: bun run build

      - name: Deploy to Cloudflare Workers
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment summary
        run: echo "Deployed royal-felt → https://royal-felt.aj-poker-app.workers.dev"
