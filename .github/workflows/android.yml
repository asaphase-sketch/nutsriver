name: Android

# Builds the TWA wrapper app (android/) on every push that touches it.
# Artifacts: signed release APK + Play-Store-ready AAB (requires the four
# ANDROID_* secrets; without them the release build comes out unsigned).
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'public/.well-known/assetlinks.json'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: build apk + aab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nutsriver-release.keystore"
            echo "keystore decoded ($RUNNER_TEMP/nutsriver-release.keystore)"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret missing — the release build will be unsigned"
          fi

      - name: Debug signing inputs (temporary)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sha256sum "$RUNNER_TEMP/nutsriver-release.keystore"
          echo "store pw length: $(printf %s "$KEYSTORE_PASSWORD" | wc -c)"
          echo "key pw length: $(printf %s "$KEY_PASSWORD" | wc -c)"

      - name: Build release APK + AAB
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/nutsriver-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nutsriver-twa-release
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
